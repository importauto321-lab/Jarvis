[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A simple, extensible voice assistant with optional Claude-powered answers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "PyAudio>=0.2.14", "pyttsx3>=2.90"]
ai = ["anthropic>=2.0"]
all = ["jarvis-assistant[voice,ai]"]
dev = ["pytest>=7"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
packages = ["jarvis"]
